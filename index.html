<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор Вилок</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px 16px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            min-height: calc(100vh - 24px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        h1.title {
            text-align: center;
            color: #f0b90b;
            font-size: 24px;
            font-weight: 700;
            margin: 6px 0 10px 0;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            display: block;
            color: #b7b7b7;
            font-size: 14px;
            margin-bottom: 6px;
        }

        input[type="number"] {
            width: 100%;
            padding: 14px 16px;
            background-color: #242424;
            border: 1px solid #333333;
            border-radius: 12px;
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            border-color: #f0b90b;
        }

        .checkbox-card {
            background-color: #242424;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .checkbox-card input[type="checkbox"] {
            width: 22px;
            height: 22px;
            accent-color: #f0b90b;
            cursor: pointer;
        }

        .checkbox-card label {
            margin-bottom: 0;
            color: #ffffff;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
        }

        .results-box {
            background-color: #222222;
            border-radius: 16px;
            padding: 16px 20px;
            margin-top: 4px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .result-row:last-child {
            margin-bottom: 0;
        }

        .result-row .label-text {
            color: #e1e1e1;
        }

        .result-row .val {
            font-weight: 700;
            font-size: 18px;
            color: #ffffff;
        }

        .val.green { color: #22c55e; }
        .val.red { color: #ef4444; }

        .disclaimer {
            text-align: center;
            color: #777777;
            font-size: 12px;
            margin-top: 6px;
            font-style: italic;
        }

        /* Блок автора внизу */
        .footer-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #0d1926;
            border: 1px solid #1c3b5e;
            border-radius: 20px;
            padding: 10px 18px;
            margin-top: 10px;
            box-shadow: 0 0 15px rgba(36, 161, 222, 0.12);
        }

        .avatar-wrapper {
            display: flex;
            align-items: center;
            margin-left: 6px;
        }

        .avatar-img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #24a1de;
            background-color: #000000;
            display: block;
        }

        .tg-btn {
            background-color: #24a1de;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="main-content">
        <h1 class="title">Калькулятор Вилок</h1>

        <div class="form-group">
            <label>Ставка на Команду 1 ($):</label>
            <input type="number" id="stake1" value="10" step="any" oninput="calculate()">
        </div>

        <div class="checkbox-card" onclick="toggleCheckbox(event)">
            <input type="checkbox" id="isFreebet" onchange="calculate()">
            <label for="isFreebet">Це фрібет (Freebet)</label>
        </div>

        <div class="form-group">
            <label>Ціна Команди 1 (напр. 0.50 або 50):</label>
            <input type="number" id="price1" value="0.50" step="any" oninput="calculate()">
        </div>

        <div class="form-group">
            <label>Ціна Команди 2 (напр. 0.40 або 40):</label>
            <input type="number" id="price2" value="0.40" step="any" oninput="calculate()">
        </div>

        <div class="results-box">
            <div class="result-row">
                <span class="label-text">Ставка на Команду 2:</span>
                <span class="val" id="resStake2">$8.00</span>
            </div>
            <div class="result-row">
                <span class="label-text">Власні витрати:</span>
                <span class="val" id="resSpent">$18.00</span>
            </div>
            <div class="result-row">
                <span class="label-text">Гарантована виплата:</span>
                <span class="val" id="resPayout">$20.00</span>
            </div>
            <div class="result-row">
                <span class="label-text">Чистий прибуток:</span>
                <span class="val green" id="resProfit">$2.00</span>
            </div>
            <div class="result-row">
                <span class="label-text">ROI від витрат:</span>
                <span class="val green" id="resRoi">11.11%</span>
            </div>
        </div>

        <div class="disclaimer">* Розрахунок без урахування комісій платформи</div>
    </div>

    <!-- Нижній блок автора -->
    <div class="footer-card">
        <div class="avatar-wrapper">
            <img src="logo.png.jpg" alt="Logo" class="avatar-img">
        </div>
        <a href="https://t.me/airdrop_crypto_ukraine" target="_blank" class="tg-btn">by @airdrop_crypto</a>
    </div>
</div>

<script>
    function toggleCheckbox(e) {
        if (e.target.tagName !== 'INPUT') {
            const cb = document.getElementById('isFreebet');
            cb.checked = !cb.checked;
            calculate();
        }
    }

    function parsePrice(val) {
        let p = parseFloat(val) || 0;
        if (p > 1) p = p / 100;
        return p;
    }

    function calculate() {
        const stake1 = parseFloat(document.getElementById('stake1').value) || 0;
        const price1 = parsePrice(document.getElementById('price1').value);
        const price2 = parsePrice(document.getElementById('price2').value);
        const isFreebet = document.getElementById('isFreebet').checked;

        if (price1 <= 0 || price2 <= 0 || stake1 <= 0) {
            document.getElementById('resStake2').innerText = "$0.00";
            document.getElementById('resSpent').innerText = "$0.00";
            document.getElementById('resPayout').innerText = "$0.00";
            document.getElementById('resProfit').innerText = "$0.00";
            document.getElementById('resRoi').innerText = "0.00%";
            return;
        }

        const shares = stake1 / price1;
        const payout = shares;
        const stake2 = payout * price2;
        const ownSpent = isFreebet ? stake2 : (stake1 + stake2);
        const profit = payout - ownSpent;
        const roi = ownSpent > 0 ? (profit / ownSpent) * 100 : (profit > 0 ? 100 : 0);

        document.getElementById('resStake2').innerText = "$" + stake2.toFixed(2);
        document.getElementById('resSpent').innerText = "$" + ownSpent.toFixed(2);
        document.getElementById('resPayout').innerText = "$" + payout.toFixed(2);

        const profitEl = document.getElementById('resProfit');
        profitEl.innerText = "$" + profit.toFixed(2);
        profitEl.className = "val " + (profit >= 0 ? "green" : "red");

        const roiEl = document.getElementById('resRoi');
        roiEl.innerText = roi.toFixed(2) + "%";
        roiEl.className = "val " + (profit >= 0 ? "green" : "red");
    }

    calculate();
</script>

</body>
</html>
