<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор Вилок</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        h1.title {
            text-align: center;
            color: #f0b90b;
            font-size: 22px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            color: #b7b7b7;
            font-size: 14px;
            margin-bottom: 8px;
        }

        input[type="number"] {
            width: 100%;
            padding: 14px 16px;
            background-color: #242424;
            border: 1px solid #333333;
            border-radius: 12px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            border-color: #f0b90b;
        }

        .checkbox-card {
            background-color: #242424;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            cursor: pointer;
        }

        .checkbox-card input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #f0b90b;
            cursor: pointer;
        }

        .checkbox-card label {
            margin-bottom: 0;
            color: #ffffff;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
        }

        .results-box {
            background-color: #222222;
            border-radius: 16px;
            padding: 18px 20px;
            margin-top: 20px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 15px;
        }

        .result-row:last-child {
            margin-bottom: 0;
        }

        .result-row .label-text {
            color: #e1e1e1;
        }

        .result-row .val {
            font-weight: 700;
            font-size: 16px;
            color: #ffffff;
        }

        .val.green {
            color: #22c55e;
        }

        .val.red {
            color: #ef4444;
        }

        .disclaimer {
            text-align: center;
            color: #777777;
            font-size: 12px;
            margin-top: 14px;
            font-style: italic;
        }

        /* Блок автора внизу */
        .footer-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #0d1926;
            border: 1px solid #1c3b5e;
            border-radius: 20px;
            padding: 10px 18px;
            margin-top: 25px;
            box-shadow: 0 0 15px rgba(36, 161, 222, 0.12);
        }

        .avatar-wrapper {
            display: flex;
            align-items: center;
            margin-left: 10px; /* Трохи зміщено вправо */
        }

        .avatar-img {
            width: 58px;  /* Збільшений розмір іконки */
            height: 58px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #24a1de;
            background-color: #000;
        }

        .tg-btn {
            background-color: #24a1de;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .tg-btn:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="title">Калькулятор Вилок</h1>

    <div class="form-group">
        <label>Ставка на Команду 1 ($):</label>
        <input type="number" id="stake1" value="10" step="any" oninput="calculate()">
    </div>

    <div class="checkbox-card" onclick="toggleCheckbox(event)">
        <input type="checkbox" id="isFreebet" onchange="calculate()">
        <label for="isFreebet">Це фрібет (Freebet)</label>
    </div>

    <div class="form-group">
        <label>Ціна Команди 1 (напр. 0.50 або 50):</label>
        <input type="number" id="price1" value="0.50" step="any" oninput="calculate()">
    </div>

    <div class="form-group">
        <label>Ціна Команди 2 (напр. 0.40 або 40):</label>
        <input type="number" id="price2" value="0.40" step="any" oninput="calculate()">
    </div>

    <div class="results-box">
        <div class="result-row">
            <span class="label-text">Ставка на Команду 2:</span>
            <span class="val" id="resStake2">$0.00</span>
        </div>
        <div class="result-row">
            <span class="label-text">Власні витрати:</span>
            <span class="val" id="resSpent">$0.00</span>
        </div>
        <div class="result-row">
            <span class="label-text">Гарантована виплата:</span>
            <span class="val" id="resPayout">$0.00</span>
        </div>
        <div class="result-row">
            <span class="label-text">Чистий прибуток:</span>
            <span class="val green" id="resProfit">$0.00</span>
        </div>
        <div class="result-row">
            <span class="label-text">ROI від витрат:</span>
            <span class="val green" id="resRoi">0.00%</span>
        </div>
    </div>

    <div class="disclaimer">* Розрахунок без урахування комісій платформи</div>

    <!-- Нижній блок з логотипом та кнопкою -->
    <div class="footer-card">
        <div class="avatar-wrapper">
            <!-- Вкажи тут шлях до своєї аватарки/логотипу (напр. logo.png) -->
            <img src="logo.png" alt="Logo" class="avatar-img" onerror="this.src='https://via.placeholder.com/58/000000/00ff7f?text=%F0%9F%8E%81'">
        </div>
        <a href="https://t.me/airdrop_crypto" target="_blank" class="tg-btn">by @airdrop_crypto</a>
    </div>
</div>

<script>
    function toggleCheckbox(e) {
        if (e.target.tagName !== 'INPUT') {
            const cb = document.getElementById('isFreebet');
            cb.checked = !cb.checked;
            calculate();
        }
    }

    function parsePrice(val) {
        let p = parseFloat(val) || 0;
        if (p > 1) p = p / 100; // Підтримка вводу 50 замість 0.50
        return p;
    }

    function calculate() {
        const stake1 = parseFloat(document.getElementById('stake1').value) || 0;
        const price1 = parsePrice(document.getElementById('price1').value);
        const price2 = parsePrice(document.getElementById('price2').value);
        const isFreebet = document.getElementById('isFreebet').checked;

        if (price1 <= 0 || price2 <= 0 || stake1 <= 0) {
            document.getElementById('resStake2').innerText = "$0.00";
            document.getElementById('resSpent').innerText = "$0.00";
            document.getElementById('resPayout').innerText = "$0.00";
            document.getElementById('resProfit').innerText = "$0.00";
            document.getElementById('resRoi').innerText = "0.00%";
            return;
        }

        // Кількість акцій/паїв при виграші першої команди
        const shares = stake1 / price1;
        const payout = shares; // 1 акція = $1 виплати

        // Необхідна ставка на команду 2, щоб отримати таку ж виплату
        const stake2 = payout * price2;

        // Власні витрати
        const ownSpent = isFreebet ? stake2 : (stake1 + stake2);

        // Чистий прибуток
        const profit = payout - ownSpent;

        // ROI
        const roi = ownSpent > 0 ? (profit / ownSpent) * 100 : (profit > 0 ? 100 : 0);

        // Оновлення UI
        document.getElementById('resStake2').innerText = "$" + stake2.toFixed(2);
        document.getElementById('resSpent').innerText = "$" + ownSpent.toFixed(2);
        document.getElementById('resPayout').innerText = "$" + payout.toFixed(2);

        const profitEl = document.getElementById('resProfit');
        profitEl.innerText = "$" + profit.toFixed(2);
        profitEl.className = "val " + (profit >= 0 ? "green" : "red");

        const roiEl = document.getElementById('resRoi');
        roiEl.innerText = roi.toFixed(2) + "%";
        roiEl.className = "val " + (profit >= 0 ? "green" : "red");
    }

    calculate();
</script>

</body>
</html>
