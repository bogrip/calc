<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surebet Calculator</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 10px; background: #121212; color: #fff; margin: 0; }
        .card { max-width: 400px; margin: auto; background: #1e1e1e; padding: 16px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
        h2 { text-align: center; margin: 0 0 8px 0; color: #f0b90b; font-size: 20px; font-weight: 700; }
        label { display: block; margin-top: 8px; font-size: 13px; color: #aaa; }
        input[type="number"] { width: 100%; padding: 8px 12px; margin-top: 4px; border-radius: 8px; border: 1px solid #333; background: #2b2b2b; color: #fff; font-size: 15px; box-sizing: border-box; outline: none; }
        input[type="number"]:focus { border-color: #f0b90b; }
        .checkbox-container { display: flex; align-items: center; margin-top: 10px; background: #252525; padding: 8px 10px; border-radius: 8px; cursor: pointer; user-select: none; }
        .checkbox-container input { width: 18px; height: 18px; margin-right: 10px; accent-color: #f0b90b; cursor: pointer; }
        .checkbox-container span { font-size: 13px; color: #fff; font-weight: 600; }
        
        .result { margin-top: 10px; padding: 10px 14px; border-radius: 10px; background: #2a2a2a; }
        .result p { margin: 5px 0; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
        .green { color: #00ff7f; font-weight: bold; }
        .red { color: #ff4d4d; font-weight: bold; }

        /* Примітка про комісії */
        .fee-note {
            font-size: 11px;
            color: #888;
            text-align: center;
            margin-top: 6px;
            font-style: italic;
        }

        /* Компактний баннер каналу */
        .channel-banner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 10px;
            padding: 6px 12px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid #24a1de;
            border-radius: 12px;
            text-decoration: none;
            color: #fff;
        }
        .channel-avatar { 
            width: 48px; 
            height: 48px; 
            border-radius: 50%; 
            object-fit: cover; 
            object-position: center 20%;
            border: 1.5px solid #24a1de; 
            flex-shrink: 0;
            background-color: #24a1de;
        }
        .tg-btn { 
            background-color: #24a1de; 
            color: #fff; 
            font-size: 12px; 
            font-weight: 700; 
            padding: 8px 14px; 
            border-radius: 16px; 
            white-space: nowrap; 
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(36, 161, 222, 0.4); 
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Калькулятор Вилок</h2>
    
    <label>Ставка на Команду 1 ($):</label>
    <input type="number" id="stake1" value="10" oninput="calculate()">

    <label class="checkbox-container">
        <input type="checkbox" id="isFreebet" onchange="calculate()">
        <span>Це фрібет (Freebet)</span>
    </label>

    <label>Ціна Команди 1 (напр. 0.50 або 50):</label>
    <input type="number" step="any" id="price1" value="0.50" oninput="calculate()">

    <label>Ціна Команди 2 (напр. 0.40 або 40):</label>
    <input type="number" step="any" id="price2" value="0.40" oninput="calculate()">

    <div class="result">
        <p>Ставка на Команду 2: <b>$<span id="stake2">0</span></b></p>
        <p>Власні витрати: <b>$<span id="totalCost">0</span></b></p>
        <p>Гарантована виплата: <b>$<span id="payout">0</span></b></p>
        <p>Чистий прибуток: <b>$<span id="profit" class="green">0</span></b></p>
        <p>ROI від витрат: <b><span id="roi" class="green">0</span>%</b></p>
    </div>

    <!-- Текстова примітка про комісії -->
    <div class="fee-note">* Розрахунок без урахування комісій платформи</div>

    <!-- Баннер каналу -->
    <a href="https://t.me/airdrop_crypto_ukraine" target="_blank" class="channel-banner">
        <img src="logo.png.jpg" alt="Logo" class="channel-avatar">
        <div class="tg-btn">by @airdrop_crypto</div>
    </a>
</div>

<script>
function calculate() {
    let s1 = parseFloat(document.getElementById('stake1').value) || 0;
    let p1 = parseFloat(document.getElementById('price1').value) || 0;
    let p2 = parseFloat(document.getElementById('price2').value) || 0;
    let isFreebet = document.getElementById('isFreebet').checked;

    if (p1 > 1) p1 /= 100;
    if (p2 > 1) p2 /= 100;

    if (s1 > 0 && p1 > 0 && p2 > 0) {
        let grossPayout1 = s1 / p1;
        let netPayout1 = isFreebet ? (grossPayout1 - s1) : grossPayout1;
        
        let s2 = netPayout1 * p2;
        let cash1 = isFreebet ? 0 : s1;
        let totalCost = cash1 + s2;
        
        let payout = netPayout1;
        let profit = payout - totalCost;
        let roi = totalCost > 0 ? (profit / totalCost) * 100 : 0;

        document.getElementById('stake2').innerText = s2.toFixed(2);
        document.getElementById('totalCost').innerText = totalCost.toFixed(2);
        document.getElementById('payout').innerText = payout.toFixed(2);
        
        let profitElem = document.getElementById('profit');
        profitElem.innerText = profit.toFixed(2);
        profitElem.className = profit >= 0 ? 'green' : 'red';

        let roiElem = document.getElementById('roi');
        roiElem.innerText = roi.toFixed(2);
        roiElem.className = roi >= 0 ? 'green' : 'red';
    }
}
calculate();
</script>

</body>
</html>
